<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html">
                Bank Loan
            </a>

            <a href="customer-dashboard.html" class="btn btn-light">
                Dashboard
            </a>
        </div>
    </nav>


    <!-- Main Content -->
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">My Applications</h2>
                <p class="text-muted mb-0">
                    View the loan applications you have submitted.
                </p>
            </div>
        </div>


        <!-- Loading -->
        <div id="loadingMessage" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">Loading your applications...</p>
        </div>


        <!-- Error -->
        <div id="errorMessage" class="alert alert-danger d-none">
        </div>


        <!-- Applications -->
        <div id="applicationsContainer" class="row g-4">
        </div>


        <!-- No Applications -->
        <div id="noApplications" class="text-center py-5 d-none">

            <div class="card shadow-sm border-0">
                <div class="card-body py-5">

                    <h4>No Applications Found</h4>

                    <p class="text-muted">
                        You have not submitted any loan applications yet.
                    </p>

                    <a href="apply-loan.html" class="btn btn-primary">
                        Apply for a Loan
                    </a>

                </div>
            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
