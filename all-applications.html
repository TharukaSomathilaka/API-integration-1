<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="bank-dashboard.html">
                Bank Loan System
            </a>

            <a href="bank-dashboard.html" class="btn btn-outline-light">
                Dashboard
            </a>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>All Loan Applications</h2>
                <p class="text-muted">
                    View all customer loan applications.
                </p>
            </div>

            <button class="btn btn-primary" onclick="getAllApplications()">
                Refresh
            </button>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">Loading applications...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <!-- Applications Table -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Applicant ID</th>
                        <th>Date Applied</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Employment</th>
                        <th>Phone</th>
                        <th>Bank Employee</th>
                        <th>PAN Card</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="applicationsTable">
                    <!-- Data will be loaded here -->
                </tbody>

            </table>
        </div>

    </div>

    <script src="/app.js"></script>

</body>

</html>
