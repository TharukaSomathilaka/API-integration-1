<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assigned Applications</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="bank-dashboard.html">
                Bank Loan System
            </a>

            <a href="bank-dashboard.html" class="btn btn-light">
                Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Applications Assigned to Me</h2>
                <p class="text-muted">
                    View loan applications assigned to you.
                </p>
            </div>

            <button class="btn btn-primary" onclick="loadAssignedApplications()">
                Refresh
            </button>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">Loading applications...</p>
        </div>

        <!-- Error -->
        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <!-- No Applications -->
        <div id="noApplications" class="alert alert-info d-none">
            No applications have been assigned to you.
        </div>

        <!-- Applications -->
        <div id="applicationsContainer" class="row g-4"></div>

    </div>

    <script src="/app.js"></script>

</body>

</html>
