<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Loan Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow mx-auto" style="max-width: 900px;">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">New Loan Application</h3>
        </div>

        <div class="card-body">

            <form id="applicationForm">

                <h5 class="mb-3">Personal Information</h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">PAN Card</label>
                        <input type="text" id="panCard" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" id="dateOfBirth" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" id="phone" class="form-control" required>
                    </div>

                </div>

                <h5 class="mt-3 mb-3">Address</h5>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea id="address" class="form-control" required></textarea>
                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">City</label>
                        <input type="text" id="city" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">State</label>
                        <input type="text" id="state" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">ZIP Code</label>
                        <input type="text" id="zipCode" class="form-control" required>
                    </div>

                </div>

                <h5 class="mt-3 mb-3">Financial Information</h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Annual Income</label>
                        <input type="number" id="annualIncome"
                               class="form-control" min="0" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employment Status</label>

                        <select id="employmentStatus" class="form-select" required>
                            <option value="">Select status</option>
                            <option value="Employed">Employed</option>
                            <option value="Self Employed">Self Employed</option>
                            <option value="Business Owner">Business Owner</option>
                            <option value="Unemployed">Unemployed</option>
                            <option value="Retired">Retired</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Credit Score</label>
                        <input type="number" id="creditScore"
                               class="form-control" min="0" max="900" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assets</label>
                        <input type="text" id="assets"
                               class="form-control"
                               placeholder="House, Car, Savings, etc.">
                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">

                    <button type="submit" class="btn btn-primary">
                        Submit Application
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        Clear
                    </button>

                </div>

            </form>

            <div id="message" class="mt-4"></div>

        </div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
